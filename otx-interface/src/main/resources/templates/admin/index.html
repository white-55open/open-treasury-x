<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>OTX 管理控制台</title>
    <style>
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; margin: 0; background: #f5f6f8; color: #333; }
        header { background: #1f2d3d; color: #fff; padding: 16px 24px; }
        header h1 { margin: 0; font-size: 20px; }
        header p.notice { margin: 6px 0 0; font-size: 12px; color: #ffc069; }
        nav { display: flex; gap: 16px; padding: 24px; }
        nav a { display: block; padding: 20px; background: #fff; border-radius: 8px; text-decoration: none;
                color: #1f2d3d; box-shadow: 0 1px 4px rgba(0,0,0,.08); width: 180px; text-align: center; font-size: 15px; }
        nav a:hover { box-shadow: 0 4px 12px rgba(0,0,0,.15); }
        nav a .desc { display: block; font-size: 12px; color: #888; margin-top: 6px; }
        main { padding: 0 24px 24px; }
        .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        footer { padding: 16px 24px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
<header>
    <h1>OTX 管理控制台</h1>
    <p class="notice">内部运维工具，仅限内网/本地使用，上线前须网关认证</p>
</header>
<nav>
    <a th:href="@{/admin/accounts}">
        账户总览
        <span class="desc">可用余额 / 冻结余额</span>
    </a>
    <a th:href="@{/admin/withdraws}">
        提现单据
        <span class="desc">单据状态与结算 / 取消</span>
    </a>
    <a th:href="@{/admin/journals}">
        凭证查看
        <span class="desc">复式记账凭证与分录</span>
    </a>
</nav>
<main class="card">
    <h2>流水时间线</h2>
    <p>按用户 ID 查看该用户的全部资金流水（充值 / 冻结 / 结算 / 解冻）。</p>
    <form th:action="@{/admin/flows}" method="get">
        <label for="uid">用户 ID：</label>
        <input type="number" id="uid" name="uid" required min="1">
        <button type="submit">查看流水</button>
    </form>
</main>
<footer>OTX（open-treasury-x）Web3 财务管理中间件 · 管理控制台</footer>
</body>
</html>
