<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>账户总览 - OTX 管理控制台</title>
    <style>
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; margin: 0; background: #f5f6f8; color: #333; }
        header { background: #1f2d3d; color: #fff; padding: 16px 24px; }
        header h1 { margin: 0; font-size: 20px; }
        header p.notice { margin: 6px 0 0; font-size: 12px; color: #ffc069; }
        nav.bar { background: #2c3e50; padding: 8px 24px; }
        nav.bar a { color: #cfd8e3; text-decoration: none; margin-right: 20px; font-size: 13px; }
        nav.bar a:hover { color: #fff; }
        main { padding: 24px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden;
                box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        th, td { padding: 10px 14px; border-bottom: 1px solid #eee; text-align: left; font-size: 14px; }
        th { background: #f0f2f5; font-weight: 600; }
        tr:hover td { background: #fafbfc; }
        .empty { padding: 24px; text-align: center; color: #999; }
        a.link { color: #409eff; text-decoration: none; }
        a.link:hover { text-decoration: underline; }
        footer { padding: 16px 24px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
<header>
    <h1>账户总览</h1>
    <p class="notice">内部运维工具，仅限内网/本地使用，上线前须网关认证</p>
</header>
<nav class="bar">
    <a th:href="@{/admin}">首页</a>
    <a th:href="@{/admin/accounts}">账户总览</a>
    <a th:href="@{/admin/withdraws}">提现单据</a>
    <a th:href="@{/admin/journals}">凭证查看</a>
</nav>
<main>
    <table>
        <thead>
        <tr>
            <th>用户 ID</th>
            <th>可用余额</th>
            <th>冻结余额</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="acc : ${accounts}">
            <td th:text="${acc.uid}">0</td>
            <td th:text="${#numbers.formatDecimal(acc.availableBalance, 1, 2)}">0.00</td>
            <td th:text="${#numbers.formatDecimal(acc.frozenBalance, 1, 2)}">0.00</td>
            <td>
                <a class="link" th:href="@{/admin/accounts/{uid}/flows(uid=${acc.uid})}">查看流水</a>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="empty" th:if="${#lists.isEmpty(accounts)}">暂无账户数据</div>
</main>
<footer>OTX（open-treasury-x）Web3 财务管理中间件 · 管理控制台</footer>
</body>
</html>
