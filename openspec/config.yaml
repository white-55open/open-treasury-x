schema: spec-driven

context: |
  # Open Treasury X (OTX)
  开源的 Web3 财务管理中间件，提供基于领域驱动的账本和资金管理系统，桥接区块链与应用层。

  ## 技术栈
  - Java 21, Spring Boot 4.0.6
  - Maven（多模块：otx-common, otx-domain, otx-infrastructure, otx-interface, otx-application, otx-starter）
  - MyBatis-Plus 3.5.15 + MySQL
  - Redis（Spring Data Redis，用于缓存）
  - web3j 5.0.3（以太坊区块链客户端，已修复 CVE：Bouncy Castle 1.84, Vert.x 5.0.7）
  - MapStruct 1.5.5.Final（对象映射）, Lombok（简化样板代码）
  - SpringDoc OpenAPI 3.0.2（API 文档）
  - Log4j2（日志，替换 Logback）
  - Spring Retry 2.0.12 + Spring AOP 3.5.14
  - Hutool 5.8.40（工具类库）

  ## 架构：DDD + 六边形架构（端口与适配器）

  ### 分层架构

  严格的依赖反转原则：所有依赖指向核心（domain），外层依赖内层，内层绝不感知外层。

  ```
                    ┌────────────────────────────────────────┐
                    │               Starter                  │
                    │          组合根 / 依赖注入              │
                    └──────────┬───────────────┬─────────────┘
                               │               │
                  ┌────────────▼─────┐  ┌──────▼──────────────┐
                  │   Interface      │  │  Infrastructure     │
                  │  入站适配器       │  │  出站适配器          │
                  │  REST 控制器     │  │  MyBatis/Redis/BC   │
                  │  WebMVC 配置     │  │  (实现 domain 中的  │
                  │  拦截器          │  │   出站端口)          │
                  └────────┬─────────┘  └──────────┬──────────┘
                           │ (调用)               │ (实现)
                           │                      │
                           ▼                      │
                  ┌──────────────────┐            │
                  │   Application    │            │
                  │   应用层          │            │
                  │  应用服务/用例   │            │
                  │  入站端口/DTO   │            │
                  │  事务管理        │            │
                  └────────┬─────────┘            │
                           │ (编排)               │
                           ▼                       ▼
                  ┌──────────────────────────────────────────┐
                  │               Domain                      │
                  │    实体 / 值对象 / 聚合 / 领域服务         │
                  │    出站端口（仓储接口、领域事件）           │
                  │             纯 Java，零框架依赖            │
                  └──────────────────────────────────────────┘
                  ┌──────────────────────────────────────────┐
                  │              Common                      │
                  │  异常、常量、统一响应、基础接口、工具类    │
                  └──────────────────────────────────────────┘
  ```

  ### 层定义

  - **otx-common（共享内核 / Shared Kernel）**：所有层共用的基础设施。包含自定义异常（BizException）、枚举（BizErrorEnum）、统一响应模型（Result<T>）、基础接口（SnowflakeIdGenerator）、工具类（SnowflakeIdUtil）。不包含任何业务逻辑。

  - **otx-domain（领域层 / 六边形核心）**：纯 Java 模块，零框架依赖（无 Spring、无 JPA、无 Lombok 业务注解）。包含：
    - **实体（Entity）**：具有唯一标识的领域对象（AccountEntity, FundFlowEntity），通过领域方法修改状态
    - **值对象（Value Object）**：不可变对象，通过属性值判断相等，无唯一标识
    - **聚合（Aggregate）**：实体及其值对象的一致性边界单元，通过聚合根访问
    - **聚合根（Aggregate Root）**：聚合的唯一入口，仓储只操作聚合根
    - **领域服务（Domain Service）**：无状态，协调多个聚合的复杂领域逻辑
    - **出站端口（Outbound Ports）**：仓储接口（AccountRepo, FundFlowRepository）——契约定义在 domain，实现在 infrastructure
    - **领域事件（Domain Event）**：记录业务发生时的重要事件，用于跨聚合通信
    - **枚举**：业务相关的枚举（FundFlowDirectionEnum, FundFlowTypeEnum）

  - **otx-application（应用层）**：用例编排层，六边形中的应用环。包含：
    - **应用服务（Application Service）**：编排领域对象完成用例，管理事务和权限（AccountAppService）
    - **入站端口（Inbound Ports）**：应用服务接口定义
    - **入站 DTO**：请求/响应对象（CreateAccountRequest, GetAccountResponse）
    - **装配器（Assembler）**：DTO 与实体之间的双向转换（AccountAssembler）
    - 应用服务仅编排，不包含业务逻辑——业务逻辑在领域层

  - **otx-interface（入站适配器层 / Inbound Adapters）**：外部世界进入系统的入口。包含：
    - **REST 控制器（Controller）**：HTTP 请求处理（AccountController）
    - **WebMVC 配置**：CORS、拦截器注册等
    - **拦截器（Interceptor）**：TraceIdInterceptor——链路追踪
    - 入站适配器调用应用层的入站端口，不直接访问领域层

  - **otx-infrastructure（出站适配器层 / Outbound Adapters）**：实现 domain 层定义的出站端口。包含：
    - **持久化适配器**：MyBatis-Plus Mapper + PO 类（**必须继承 `BasePO`**：id / version / deleteFlag / 审计字段 / tenantId 由基类统一管理，注解风格 `@Data` + `@EqualsAndHashCode(callSuper = true)` + `@TableName("<table>")`，参考 `AccountPO` / `FundFlowPO`）+ RepoImpl（实现 domain 层的 Repo 接口）
    - **转换器（Converter）**：MapStruct PO <-> Entity 转换（AccountConverter），负责状态/枚举字段的 String ↔ Enum 双向映射
    - **缓存适配器**：Redis 缓存实现
    - **区块链适配器**：web3j 客户端封装
    - **技术组件**：雪花 ID 生成器实现（SnowflakeIdGeneratorImpl）、审计元数据填充器（AuditMetaObjectHandler）
    - **全局异常处理器**：将异常转换为统一响应

  - **otx-starter（组合根 / Composition Root）**：Spring Boot 入口，负责将各层组装在一起：
    - **依赖注入配置**：所有 Bean 的装配
    - **application.yaml**：外部化配置
    - **日志配置**：Log4j2
    - 不包含业务逻辑——仅连接各模块

  ### 依赖规则

  ```
  interface ──→ application ──→ domain
  infrastructure ──────────────→ domain（实现出站端口）
  starter ──→ interface + infrastructure（组合根）
  common 被所有层依赖，不依赖任何业务模块
  ```

  1. **domain**：零依赖（仅 Java SE，纯 Java —— 无框架注解）
  2. **common**：零业务依赖，可被所有层依赖
  3. **application**：依赖 domain、common
  4. **interface**：依赖 application、domain、common（入站适配器调用应用层入站端口）
  5. **infrastructure**：依赖 domain、common（实现 domain 层定义的出站端口——绝不依赖 application）
  6. **starter**：依赖所有模块（组合根角色）
  7. **反向依赖禁止**：domain 绝不能依赖 application、infrastructure 或 interface
  8. **循环依赖禁止**：任何模块之间不能有循环依赖

  ## DDD 战术模式约束

  ### 聚合（Aggregate）约束
  1. 每个聚合通过聚合根（Aggregate Root）访问，外部不能直接操作聚合内部对象
  2. 聚合内部的一致性边界由聚合根保证
  3. 一个事务只修改一个聚合——跨聚合一致性通过领域事件 + 最终一致性实现
  4. 每个聚合对应一个仓储接口，仓储只操作聚合根
  5. 聚合根通过标识（id）相等判断，而非属性值

  ### 值对象（Value Object）约束
  1. 不可变：所有业务字段为 final，不暴露 setter
  2. **持久化的值对象同样继承 `BaseEntity`**：DB 持久化需要 surrogate id 与审计/version 字段；业务字段保持 final（`@Data` 不会为 final 字段生成 setter，天然满足不可变），BaseEntity 的审计/version 字段保持默认可变（由框架在持久化时回填）
  3. 通过所有属性值判断相等（重写 equals/hashCode）
  4. 无业务唯一标识（surrogate id 是技术主键，非业务标识）
  5. 自验证：构造时验证所有业务约束，确保始终有效

  ### 实体（Entity）约束
  1. 具有唯一标识（id 字段）
  2. **必须继承 `BaseEntity`**：通过继承获得 id、version（@Version）、deleteFlag（@TableLogic）、审计字段（createdBy/createTime/lastUpdatedBy/lastUpdateTime）、tenantId 等基础设施字段；注解风格为 `@Data` + `@EqualsAndHashCode(callSuper = true)`（参考 `AccountEntity` / `FundFlowEntity`）
  3. 可变：通过领域方法修改状态，不暴露属性 setter
  4. 相等通过标识判断（equals/hashCode 基于 id）
  5. 封装业务行为：所有状态变更通过有业务含义的方法（如 withdraw、deposit），而非直接修改字段

  ### 领域服务（Domain Service）约束
  1. 无状态（stateless），所有状态通过参数传入
  2. 命名体现业务活动（动词 + 名词，如 TransferService、LedgerService）
  3. 用于跨聚合的复杂领域逻辑或与外部系统协调的领域规则
  4. 依赖接口（出站端口），不依赖具体实现

  ### 仓储（Repository）约束
  1. **接口**定义在 domain 层（出站端口）
  2. **实现**在 infrastructure 层（出站适配器）
  3. 接口命名体现集合语义（save、find、remove 而非 insert、select、delete）
  4. 每个聚合根一个仓储接口
  5. 仓储方法返回聚合根或聚合根集合，不返回 PO

  ### 领域事件（Domain Event）约束
  1. 不可变值对象
  2. 过去时命名（AccountCreated、FundsDeposited、WithdrawCompleted）
  3. 包含事件发生时所需的所有上下文数据
  4. 跨聚合通信通过领域事件 + 事件总线，而非直接调用
  5. 事件处理在应用层编排（发布事件、处理副作用）

  ### 应用服务（Application Service）约束
  1. 一个用例 = 一个应用服务公共方法
  2. 职责：开启事务→调用领域对象→发布领域事件→返回结果
  3. 不包含业务逻辑——仅编排和协调
  4. 事务边界在应用服务层（@Transactional）
  5. 幂等性和并发重试在应用服务层处理

  ## 包命名规范
  io.github.open55.otx.<层>.<限界上下文>.<类型>
  限界上下文：account, fundflow, deposit, withdraw, ledger, common

  ## 命名约定
  - Entity 后缀：领域实体（AccountEntity, FundFlowEntity）
  - PO 后缀：持久化对象（AccountPO, FundFlowPO）
  - Repo 后缀：仓储接口（AccountRepo, FundFlowRepo）
  - Mapper 后缀：MyBatis 映射器（AccountMapper）
  - Converter 后缀：MapStruct PO-Entity 转换器（AccountConverter）
  - DomainService 后缀：领域服务（LedgerPostingDomainService）
  - AppService 后缀：应用服务（AccountAppService, DepositAppService）
  - Controller 后缀：REST 控制器（AccountController）
  - RequestDTO/ResponseDTO 后缀：入站/出站 DTO（PostJournalRequestDTO, JournalDetailResponseDTO），所有 DTO 类名统一加 DTO 后缀
  - Config 后缀：配置类（MyBatisConfig, WebMvcConfig）
  - *Interceptor：拦截器（TraceIdInterceptor）
  - *Handler：处理器（GlobalExceptionHandler, AuditMetaObjectHandler）

  ## 编码规范
  - Lombok：@Data 用于实体/DTO/PO，@Builder，@RequiredArgsConstructor（构造器注入），@Slf4j 用于服务类，@Getter + @RequiredArgsConstructor 用于枚举，@EqualsAndHashCode(callSuper = true) 用于继承基类的实体
  - MapStruct：基于接口，使用 INSTANCE = Mappers.getMapper(...)，@Mapper(builder = @Builder(disableBuilder = true)) 避免与 Lombok builder 冲突
  - MyBatis-Plus：所有 PO 类**必须继承 `BasePO`**（id 由 `@TableId(ASSIGN_ID)` 雪花自增、version 由 `@Version` 乐观锁管理、deleteFlag 由 `@TableLogic` 软删除、4 个审计字段由 `@TableField(fill = INSERT/INSERT_UPDATE)` 配合 `AuditMetaObjectHandler` 自动填充、tenantId 手动填充），继承后子类只需声明业务字段；Mapper 继承 `BaseMapper<T>`，PO 标注 `@TableName("<table>")`；LambdaQueryWrapper 流式 API
  - Spring：@Service, @Repository, @RestController, @Configuration，通过 @RequiredArgsConstructor 构造器注入，@Transactional(propagation = REQUIRES_NEW) 保证资金流水原子记录，@Retryable(retryFor = OptimisticLockException.class, maxAttempts = 5, backoff = @Backoff)
  - 统一响应：Result<T> 包装类，包含 code, message, data, timestamp, traceId —— 所有响应返回 HTTP 200 状态码，业务错误通过业务码区分
  - 链路追踪：TraceIdInterceptor 从 HTTP 头或 UUID 提取/注入 traceId，存储在 SLF4J MDC 中实现日志关联
  - 异常层次：RuntimeException -> BizException（含 BizErrorEnum 的 code + message）；BizException -> OptimisticLockException；RuntimeException -> BizIdempotentException
  - 雪花 ID：自定义 SnowflakeIdGeneratorImpl（纪元：1700000000000L，5-bit 工作节点，5-bit 数据中心，12-bit 序列号，通过配置属性设置 worker-id 和 data-center-id）
  - 幂等性：fund_flow_t 表的 biz_no 唯一索引，DuplicateKeyException 转换为 BizIdempotentException
  - 多租户：BaseEntity/BasePO 中包含 tenantId 字段（已定义但尚未在查询中启用）
  - 注释与描述：**代码注释、Javadoc、Markdown 描述、OpenSpec 产出物（proposal / design / tasks / spec）使用中文；Git 提交说明使用中英双语**（中文在前，英文在后，语义等价）。标识符、代码、SQL、配置、日志标签等不需要翻译；具体细则见下方 `rules.documentation` 铁律

  ## 领域模型
  - AccountEntity：uid（唯一业务键）、availableBalance、frozenBalance —— 领域方法：freezeBalance, unfreezeBalance, increaseBalance, withdraw, deposit
  - FundFlowEntity：flowNo（唯一）、uid、bizNo（唯一幂等键）、amount、balanceBefore、balanceAfter、direction（IN/OUT）、type（DEPOSIT/WITHDRAW/FREEZE/UNFREEZE）
  - LedgerEntryEntity：（规划中）复式记账，包含 DEBIT/CREDIT 分录类型
  - BaseEntity：id, version（@Version）, deleteFlag（@TableLogic）, createdBy, createTime, lastUpdateTime, lastUpdatedBy, tenantId

  ## 持久化模型
  - BasePO：id（@TableId type=ASSIGN_ID）, version（@Version）, deleteFlag（@TableLogic）, createdBy（FieldFill.INSERT）, createTime（FieldFill.INSERT）, lastUpdateTime（FieldFill.INSERT_UPDATE）, lastUpdatedBy（FieldFill.INSERT_UPDATE）, tenantId（手动填充）；PO 与 Entity 字段一一对应，但 PO 中状态/枚举字段一律为 String（与 DB VARCHAR 一致），由 Converter 做 String ↔ Enum 互转

  ## 数据库
  - account_t：id, uid（唯一索引）, available_balance（DECIMAL 38,18）, frozen_balance, version, delete_flag, created_by, last_updated_by, create_time, last_update_time, tenant_id
  - fund_flow_t：id, flow_no（唯一索引）, uid, biz_no（唯一索引）, amount, balance_before, balance_after, direction, type, version, ..., tenant_id
  - ledger_entry_t：（规划中）biz_no + account_code + entry_type 联合唯一索引

  ## 测试
  - JUnit 5 + Spring Boot Test 4.0.1（spring-boot-starter-test）
  - Mockito 通过传递依赖可用
  - otx-starter 中已有上下文加载测试和并发乐观锁测试

  ## 构建与运行
  - Maven 包装器（mvnw/mvnw.cmd），mvn clean install 构建全部 6 个模块
  - 注解处理器顺序：Lombok -> Lombok-MapStruct-Binding -> MapStruct
  - 服务端口：8003（默认）
  - 数据库：MySQL（localhost:3307），Redis（localhost:6380）通过 -D 系统属性配置
  - 雪花 ID：data-center-id=1, worker-id=2（默认）
  - 日志：Log4j2 控制台 + 滚动文件输出到 /applogs/otx/app.log，格式包含 [%X{traceId}]
  - 运行：java -jar otx-starter/target/otx-starter-0.0.1-SNAPSHOT.jar 带 JVM 参数

  ## 提交规范
  使用 Conventional Commits（feat, fix, refactor, docs, test, chore 等），说明文字必须使用中英双语（中文在前，英文在后）

rules:
  documentation:
    - 代码注释Javadoc：全部使用中文，无需附带英文版本。例外：标识符、日志标签、枚举字面量、SQL/DSL 关键字、JSON 键等保持原样
    - Markdown 文档描述：全部使用中文，无需附带英文版本
    - OpenSpec 产出物（proposal.md / design.md / tasks.md / spec.md）：全部使用中文。标题及正文段落均无需附带英文版本
    - Git 提交说明：必须使用中英双语，中文在前/在上，英文在后/在下，语义等价。格式示例：`feat:添加账户冻结功能 / feat:add account freeze feature`
    - 代码示例、命令、SQL、配置片段保持原样不翻译；其上方/下方的解释性文字使用中文
    - 业务术语首次出现时推荐给出中英对照（如"聚合根 Aggregate Root"），后续可单语引用
    - 公开 API 的 Javadoc 使用中文，方法签名和参数名保持英文
    - 实体（Entity）、值对象（Value Object）、持久化对象（PO）、DTO（Request/Response）的**每个业务字段**必须使用中文 Javadoc 多行格式说明其业务含义。禁止任何单行形式（`// 行注释`、`/** 紧凑注释 */`）。
      字段 Javadoc 唯一合法格式（空行可选）：
      ```java
      /**
       * 用户唯一标识，作为账户的业务键
       */
      private Long uid;
      ```
      禁止出现的错误示例：
      ```java
      // 用户唯一标识（裸行注释）
      private Long uid;
      /** 用户唯一标识（紧凑单行）*/
      private Long uid;
      ```
    - 领域方法（含实体/值对象的领域方法、应用服务方法、控制器方法）必须使用中文 Javadoc 说明其业务行为、参数含义和返回值含义。方法体内关键逻辑分支（if/else、异常抛出的条件等）必须用中文行内注释说明判断理由
    - MapStruct Converter 的每个映射方法必须使用中文注释说明转换方向（如"Entity → PO"）及特殊映射规则（如枚举字段 String ↔ Enum 互转）
  architecture:
    - 遵循 DDD + 六边形架构分层约束，禁止违反依赖方向（domain 绝不依赖 infrastructure/application/interface）
    - 领域层必须为纯 Java（零框架注解：无 Spring、无 JPA、无 Lombok 业务注解）
    - 一个事务只修改一个聚合——跨聚合一致性通过领域事件 + 最终一致性实现
    - 仓储接口在 domain 层定义（出站端口），实现类在 infrastructure 层（出站适配器）
    - 入站适配器（interface）调用应用层入站端口，不直接访问领域层
    - 应用服务不包含业务逻辑，仅编排领域对象
    - 聚合根通过工厂方法或仓储创建，不直接用 new 实例化复杂聚合
    - 值对象必须不可变，且基于所有属性值判断相等
    - 反向依赖和循环依赖严格禁止——通过 Maven 模块依赖关系强制检查
    - 所有领域实体（含持久化的值对象）必须继承 `BaseEntity`（id / version / 审计 / tenantId）；注解风格 `@Data` + `@EqualsAndHashCode(callSuper = true)`；值对象的业务字段保持 final 不可变
    - 所有基础设施 PO 类必须继承 `BasePO`（id / version / deleteFlag / 审计 / tenantId）；注解风格 `@Data` + `@EqualsAndHashCode(callSuper = true)` + `@TableName("<table>")`；PO 与 Entity 字段一一对应，但 PO 中状态/枚举字段一律为 String，由 Converter 在 PO ↔ Entity 转换时做 String ↔ Enum 互转
  proposal:
    - 提案应简洁聚焦于单一变更
    - 必须包含"动机"、"设计方案"和"非目标"章节
    - 引用相关的限界上下文
    - 设计方案应说明变更影响的六边形层和 DDD 构件（聚合、实体、值对象、领域事件等）
  design:
    - 使用 ASCII 图表描述流程
    - 明确 API 变更、数据库 schema 变更、领域模型变更和聚合边界变更
    - 考虑幂等性和并发（乐观锁、重试）
    - 说明跨聚合一致性策略（最终一致性 vs 强一致性）
    - 明确领域事件的定义和传播方式
  tasks:
    - 拆分为独立的小任务（每个最多 2 小时）
    - 每个任务应可独立测试
    - 每个任务包含测试要求
    - 建议按层拆分任务顺序：领域层 → 应用层 → 适配器层
    - 领域层任务优先，确保业务逻辑独立于技术实现
    - 执行流程（默认）：执行当前任务 → 验证 → 展示代码变更摘要 → 提醒用户人工 review 代码 → 用户提交 git commit → 用户确认"continue"后继续下一个任务
    - 执行流程（非默认）：用户必须明确指定执行到哪个编号（如"执行到 task 3"），或指定一次执行完所有 task（如"全部执行"），否则按默认逐个任务执行
  specs:
    - 按限界上下文组织在 specs/<bounded-context>/spec.md 下
    - 每个规范定义行为、不变量和验收标准
    - 明确每个限界上下文的聚合根、聚合边界和领域事件
  logging:
    - 日志消息（log.info/warn/error/debug 的字符串内容）必须使用英文编写
    - 每条日志语句上方必须添加一行中文注释，说明该日志的触发场景和含义
    - 格式示例：
      ```java
      // 总账过账失败，记录错误信息供排查
      log.warn("Journal posting failed, bizNo={}", bizNo, e);
      ```
    - 使用 `@Slf4j` 注解声明 log 对象，禁止手动声明 Logger
  test:
    - 所有 test.java 文件必须包含测试意图注释：Test 类 Javadoc（中文，说明被测对象与覆盖范围），每个 @Test 方法 Javadoc（中文，描述场景的业务含义与预期结果）
    - 测试方法名采用 snake_case 业务命名（如 `construct_withInvalidAccountCode_throwsAccountCodeInvalid`），做到"读名知意"
    - 单元测试覆盖正常路径与所有错误码分支，集成测试覆盖端到端业务流与并发/幂等场景
    - 测试数据构造使用具名常量或 builder，禁止魔法数字与硬编码字符串散落各处
